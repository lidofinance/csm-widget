name: CI Dev Hoodi

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - ".github/**"

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # needs: test
    name: Build and deploy
    steps:
      - name: Testnet deploy
        uses: lidofinance/dispatch-workflow@v1
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TARGET_REPO: "lidofinance/infra-mainnet"
          TARGET_WORKFLOW: "deploy_hoodi_testnet_csm_widget.yaml"
          TARGET: "develop"

  csm-smoke-tests:
    needs: deploy
    secrets: inherit
    uses: ./.github/workflows/tests.yml
    with:
      stand_type: "testnet"
      tags: "smoke"
      qase_plan_id: 3 # Smoke test Plan

  cm-smoke-tests:
    needs: deploy
    secrets: inherit
    uses: ./.github/workflows/tests-fork-cm.yml
    with:
      stand_type: "testnet"
      tags: "smoke"
