name: Harbor image (dev)

run-name: Build and push csm-widget:dev to dev

# develop => dev cluster. Pushes registry.dev.k8s-dev.org/team-csm/csm-widget:dev.
# Build is delegated to the org-shared reusable workflow (SHA-pinned):
#   lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml
on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - ".github/**"

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@c7b5b6c5d8013046347d728d748fa741eb214e28
    with:
      tag: dev
      registry: registry.dev.k8s-dev.org
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      image: team-csm/csm-widget
      environment: harbor_dev_release
    secrets:
      registry_token: ${{ secrets.HARBOR_DEV_TOKEN }}
