name: Harbor image (superapp)

run-name: Build and push csm-widget:${{ inputs.tag || 'pr-718' }} to dev

# develop-superapp => preview stand. Pushes registry.dev.k8s-dev.org/team-csm/csm-widget:pr-718.
# Kyverno on the cluster admits only dev/staging/vX.Y.Z/pr-<N> tags, hence the PR number.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        type: string
        default: pr-718
  push:
    branches:
      - develop-superapp
    paths-ignore:
      - ".github/**"

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@c7b5b6c5d8013046347d728d748fa741eb214e28
    with:
      tag: ${{ inputs.tag || 'pr-718' }}
      registry: registry.dev.k8s-dev.org
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      image: team-csm/csm-widget
      environment: harbor_dev_release
    secrets:
      registry_token: ${{ secrets.HARBOR_DEV_TOKEN }}
