name: Harbor image (staging)

run-name: Build and push csm-widget:staging to staging

# main => staging cluster. Registry and credentials are chosen by the SHA-pinned reusable workflow per target.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@8d22c57b310ff5ebc27b8883bb4d0048e39c6430
    with:
      target: staging
      harbor_project: team-csm
      image: csm-widget
    secrets: inherit
