name: CI Dev Hoodi (test)

# Copy of ci-dev.yml used to debug the pipeline itself.
# Differences from the original:
#   - deploy does NOT dispatch the real workflow in infra-mainnet, it only
#     prints what it would have done;
#   - triggered by a push to the debug branch, with no paths-ignore, so that
#     changes under .github/** also start a run.
# Everything else (job names, needs, permissions, the tests.yml /
# tests-fork-cm.yml calls, secrets: inherit, inputs) is identical to ci-dev.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - test/send-result-to-slack

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy (dry run)
    steps:
      - name: Testnet deploy (dry run)
        run: |
          echo "DRY RUN — no real deploy is performed."

  csm-smoke-tests:
    name: Post-deploy CSM smoke
    needs: deploy
    secrets: inherit
    uses: ./.github/workflows/tests.yml
    with:
      stand_type: "testnet"
      tags: "smoke"
      qase_plan_id: 3 # Smoke test Plan
      report_enabled: true

  cm-smoke-tests:
    name: Post-deploy CM smoke
    needs: deploy
    secrets: inherit
    uses: ./.github/workflows/tests-fork-cm.yml
    with:
      stand_type: "testnet"
      tags: "smoke"
      report_enabled: true
