name: Harbor image (prod)

run-name: Build and push csm-widget release image to prod

# Released GitHub release => Run_on_release => this workflow (default branch) => prod cluster.
on:
  workflow_run:
    workflows:
      - Run_on_release
    types:
      - completed

permissions: {}

jobs:
  release-tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Download release tag
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-tag
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/release-artifact

      - name: Validate release tag
        id: release
        shell: bash
        env:
          TAG_FILE: ${{ runner.temp }}/release-artifact/release_tag.txt
        run: |
          set -euo pipefail

          if [[ ! -f "$TAG_FILE" || -L "$TAG_FILE" ]]; then
            echo "::error::Release tag artifact is not a regular file"
            exit 1
          fi

          mapfile -t lines < "$TAG_FILE"
          if [[ "${#lines[@]}" -ne 1 || ! "${lines[0]}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag artifact must contain exactly one stable SemVer tag"
            exit 1
          fi

          echo "tag=${lines[0]}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: release-tag
    permissions:
      contents: read
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@8d22c57b310ff5ebc27b8883bb4d0048e39c6430
    with:
      target: prod
      tag: ${{ needs.release-tag.outputs.tag }}
      harbor_project: team-csm
      image: csm-widget
    secrets: inherit
